services:
  front: # フロントエンド
    build: ./front
    volumes:
      - ./front:/usr/src/app:delegated
      - /usr/src/app/node_modules # ホスト側に node_modules をマウントしない
    ports:
      - "3000:3000"

  back: # バックエンド
    build: ./back
    image: node:16.14.0
    working_dir: /usr/src/app
    tty: true
    ports: 
      - "3001:3001" # API のポート
      - "5000:5000" # Socket.IO のポートを追加
    volumes:
      - ./back:/usr/src/app:delegated
      - /usr/src/app/node_modules
